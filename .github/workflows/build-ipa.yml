name: Build IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and archive (no code signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Fastfetch.xcodeproj \
            -scheme Fastfetch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fastfetch.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/Fastfetch.xcarchive/Products/Applications/Fastfetch.app"
          test -d "$APP_PATH"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          mkdir -p build-artifacts
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/build-artifacts/Fastfetch.ipa" Payload)
          ls -lh build-artifacts/Fastfetch.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fastfetch-IPA
          path: build-artifacts/Fastfetch.ipa
          if-no-files-found: error
